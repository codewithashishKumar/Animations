<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5. Rotating Sun & Orbiting Planet</title>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #000;
        min-height: 100vh;
    }

    .containerDIV {
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: transparent;
        height: 300px;
        width: 300px;
        border-radius: 50%;
        position: relative;
    }

    .sun {
        position: absolute;
        width: 60px;
        height: 60px;
        background: radial-gradient(circle, #fff176, #FFC107, #ff9800);
        border-radius: 50%;
    }

    .orbit {
        position: absolute;
        width: 300px;
        height: 300px;
        background-color: transparent;
        border-radius: 50%;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        border: 0.5px solid yellow;
        animation: rotate 5s linear infinite;
    }

    .planet {
        width: 40px;
        height: 40px;
        position: absolute;
        top: 50%;
        left: 100%;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle at 30% 30%, #90caf9, #1565c0);
        border-radius: 50%;
    }

    @keyframes rotate {
        from {
            transform: translate(-50%, -50%) rotate(0deg);
        }

        to {
            transform: translate(-50%, -50%) rotate(360deg);
        }
    }
</style>

<body>
    <section class="containerDIV">
        <div class="sun"></div>
        <div class="orbit">
            <div class="planet"></div>
        </div>
    </section>
</body>

</html>
