<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <title>Bootstrap Forms</title>
</head>

<body>
    <section class="m-2 border border-2 border-dark rounded-3 p-3">
        <h4>Bsic Form Syntax</h4>
        <form action="">
            <label for="name" class="form-label">Enter Name</label>
            <input id="name" type="text" class="form-control" placeholder="Enter Your Name">
        </form>
    </section>
    <section class="m-2 border border-2 border-dark bg-info rounded-3 p-3">
        <h4>Form Task - build 2 inputs and 2 labels</h4>
        <form action="">
            <label for="name" class="form-label">Enter Name</label>
            <input id="name" type="text" class="form-control" placeholder="Enter Your Name">
            <label for="password" class="form-label">Enter Password</label>
            <input id="password" type="password" class="form-control" placeholder="Enter Your Password">
        </form>
    </section>
    <section class="m-2 border border-2 border-dark rounded-3 p-3">
        <h4>Form Group</h4>
        <form>
            <div class="mb-3">
                <label class="form-label">
                    Name
                </label>
                <input type="text" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">
                    Password
                </label>
                <input type="password" class="form-control">
            </div>
        </form>
    </section>
    <section class="m-2 border border-2 border-dark rounded-3 p-3">
        <h4>Textarea</h4>
        <form>
            <div class="mb-3">
                <label class="form-label">
                    Message
                </label>
                <textarea class="form-control" rows="4"></textarea>
            </div>
        </form>
    </section>
    <section class="m-2 border border-2 border-dark rounded-3 p-3">
        <h4>Select Menu</h4>
        <form>
            <div class="mb-3">
                <label class="form-label" for="selectMenu">
                    Select Country
                </label>
                <select name="select" id="selectMenu" class="form-select">
                    <option value="India">India</option>
                    <option value="America">America</option>
                    <option value="England">England</option>
                </select>
            </div>
        </form>
    </section>
    <section class="m-2 border border-2 border-dark rounded-3 p-3">
        <h4>Form Checkbox </h4>
        <form>
            <div class="form-check">
                <input type="checkbox" name="check" id="checkbox" class="form-check-input">
                <label class="form-check-label" for="checkbox">Accept Terms</label>
            </div>
        </form>
    </section>
    <section class="m-2 border border-2 border-dark rounded-3 p-3">
        <h4>Radio Button</h4>
        <form>
            <div class="form-check">
                <input type="radio" class="form-check-input" id="male" name="gender">
                <label class="form-check-label" for="male">
                    Male
                </label>
            </div>
            <div class="form-check">
                <input type="radio" class="form-check-input" id="female" name="gender">
                <label class="form-check-label" for="female">
                    Female
                </label>
            </div>
        </form>
    </section>


    <section class="m-2 border border-2 border-dark rounded-3 p-3">
        <h4>Form radio task - 2 countries</h4>
        <form action="">
            <div class="form-check">
                <input type="radio" name="country" id="india" class="form-check-input">
                <label for="india" class="form-check-label">India</label>
            </div>
            <div class="form-check">
                <input type="radio" name="country" id="america" class="form-check-input">
                <label for="america" class="form-check-label">America</label>
            </div>
        </form>
    </section>

    <section class="m-2 border border-2 border-dark rounded-3 p-3">
        <h4>Switch</h4>
        <form>
            <div class="form-check form-switch">
                <input type="checkbox" class="form-check-input" id="notification">
                <label class="form-check-label" for="notification">
                    Enable Notifications
                </label>
            </div>
        </form>
    </section>
    <section class="m-2 border border-2 border-dark rounded-3 p-3">
        <h4>Switch task</h4>
        <form action="">
            <div class="form-check form-switch">
                <input type="checkbox" id="mode" class="form-check-input">
                <label class="form-check-label" for="mode">Enable Dark Mode</label>
            </div>
        </form>
    </section>

    <section class="m-2 border border-2 border-dark rounded-3 p-3">
        <h4>Form Button</h4>
        <form>
            <div class="mb-3">
                <label class="form-label">
                    Name
                </label>
                <input type="text" class="form-control">
            </div>
            <button type="submit" class="btn btn-primary">
                Submit
            </button>
        </form>
    </section>

    <section class="m-2 border border-2 border-dark rounded-3 p-3">
        <h4>Task on Disabled & Readonly</h4>
        <form action="/">
            <div class="mb-3">
                <label class="form-label" for="username">Username</label>
                <input type="text" id="username" class="form-control" value="Admin" disabled>
            </div>
            <div class="mb-3">
                <label class="form-label" for="email">Email</label>
                <input type="email" id="email" class="form-control" value="admin@gmail.com" readonly>
            </div>
        </form>
    </section>

    <section class="m-2 border border-2 border-dark rounded-3 p-3">
        <h4>Registration Form task</h4>
        <form action="">
            <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input id="name" type="text" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input id="email" type="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="select">Course</label>
                <select name="select" id="select" class="form-select">
                    <option value="">Select Course</option>
                    <option value="html">HTML</option>
                    <option value="css">CSS</option>
                    <option value="bootstrap">Bootstrap</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="about" class="form-label">About Yourself</label>
                <textarea name="about" id="about" class="form-control" rows="4"></textarea>
            </div>
            <div class="form-check">
                <input type="radio" id="male" name="gender2" class="form-check-input">
                <label for="male" class="form-check-label">Male</label>
            </div>
            <div class="form-check">
                <input type="radio" id="female" name="gender2" class="form-check-input">
                <label for="female" name="gender2" class="form-check-label">Female</label>
            </div>
            <div class="mb-3">
                <input type="checkbox" id="termsD" class="form-check-input">
                <label for="termsD" class="form-check-label">Accept Terms checkbox</label>
            </div>
            <div class="mb-3">
                <button class="btn btn-outline-dark ">Submit</button>
            </div>
        </form>
    </section>
</body>

</html>
