<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <title>Navbars</title>
</head>

<body>
    <section class="w-75 m-3 border border-dark p-3 rounded-4">
        <h4 class="border-bottom border-secondary">basic navbar</h4>
        <nav class="navbar">
            <a class="navbar-brand">
                My Website
            </a>
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link">
                        Home
                    </a>
                </li>
            </ul>
        </nav>
    </section>
    <section>
        <h4>Responsive Navbar</h4>
        <nav class="navbar navbar-expand-lg bg-dark">
            <div class="container">
                <a href="#" class="navbar-brand text-light">Brand Name</a>
                <button class="navbar-toggler bg-light" data-bs-toggle="collapse" data-bs-target="#menu">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse " id="menu">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a href="#" class="nav-link text-light">Home</a>
                        </li>
                        <li class="nav-item">
                            <a href="#" class="nav-link text-light active">About</a>
                        </li>
                        <li class="nav-item">
                            <a href="#" class="nav-link text-light disabled">Contact</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </section>

</body>

</html>
