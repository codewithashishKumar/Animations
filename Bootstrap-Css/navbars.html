<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <title>Navbars</title>
</head>

<body>
    <section class="w-75 m-3 border border-dark p-3 rounded-4">
        <h4 class="border-bottom border-secondary">basic navbar</h4>
        <nav class="navbar">
            <a class="navbar-brand">
                My Website
            </a>
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link">
                        Home
                    </a>
                </li>
            </ul>
        </nav>
    </section>
    <section>
        <h4>Responsive Navbar</h4>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a href="#" class="navbar-brand text-light">Brand Name</a>
                <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse " id="menu">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a href="#" class="nav-link">Home</a>
                        </li>
                        <li class="nav-item">
                            <a href="#" class="nav-link ">About</a>
                        </li>
                        <li class="nav-item">
                            <a href="#" class="nav-link disabled">Contact</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </section>
    <section class="m-4">
        <h4>Navbar Dropdowns</h4>
        <nav class="navbar navbar-expand-md bg-info navbar-light">
            <div class="container">
                <a href="" class="navbar-brand">Dropdown</a>
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a href="" class="nav-link">Home</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a href="" class="nav-link dropdown-toggle" data-bs-toggle="dropdown">Services</a>
                        <div class="dropdown-menu">
                            <span class="dropdown-item">Web Development</span>
                            <span class="dropdown-item">App Development</span>
                            <span class="dropdown-item">SEO</span>
                        </div>
                    </li>
                </ul>
            </div>
        </nav>
    </section>
    <section class="m-3 p-3 border border-3 border-dark">
        <h4>Navbar dropdown Task</h4>
        <nav class="navbar navbar-expand-sm bg-warning">
            <div class="container">
                <a href="" class="navbar-brand">Brand Name</a>
                <ul class="navbar-nav ms-auto ">
                    <li class="nav-item">
                        <a href="" class="nav-link">Home</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a href="" class="nav-link dropdown-toggle" data-bs-toggle="dropdown">Services</a>
                        <div class="dropdown-menu">
                            <span class="dropdown-item">Solo Service</span>
                            <span class="dropdown-item">Group Service</span>
                        </div>
                    </li>
                </ul>
            </div>
        </nav>
    </section>

</body>

</html>
