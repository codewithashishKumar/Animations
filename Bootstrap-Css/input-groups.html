<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <title>Input-Groups</title>
</head>

<body>
    <section class="m-2 border border-2 border-dark rounded-3 p-3">
        <h4>Input Group Syntax</h4>
        <div class="input-group">
            <span class="input-group-text">₹</span>
            <input type="number" class="form-control">
        </div>
    </section>
    <section class="m-2 border border-2 border-dark rounded-3 p-3 d-flex flex-column gap-3">
        <h4>Input Group Task - Website Input Group</h4>
        <div class="input-group">
            <span class="input-group-text">https://</span>
            <input type="url" class="form-control">
        </div>
        <div class="input-group">
            <span class="input-group-text">@</span>
            <input type="email" class="form-control">
        </div>
        <div class="input-group">

            <input type="email" class="form-control" placeholder="enter username">
            <span class="input-group-text">@gamil.com</span>
        </div>
        <div class="input-group">
            <input type="search" class="form-control" placeholder="Search">
            <button class="btn btn-primary">Search</button>
        </div>
    </section>
    <section class="m-2 border border-2 border-dark rounded-3 p-3">
        <h4>Input Group Sizes</h4>
        <div class="input-group input-group-sm mb-3">
            <span class="input-group-text">Small</span>
            <input type="text" class="form-control">
        </div>
        <div class="input-group mb-3">
            <span class="input-group-text">Normal</span>
            <input type="text" class="form-control">
        </div>
        <div class="input-group input-group-lg">
            <span class="input-group-text">Large</span>
            <input type="text" class="form-control">
        </div>
    </section>
    <section class="m-2 border border-2 border-dark rounded-3 p-3 d-flex flex-column gap-3">
        <h4>Final Practice: Complete Input Group Build</h4>
        <div class="input-group">
            <span class="input-group-text">₹</span>
            <input type="number" value="500" class="form-control">
        </div>
        <div class="input-group">
            <input class="form-control" placeholder="DISCOUNT20"></input>
            <button class="btn btn-primary">Apply</button>
        </div>
        <div class="input-group">
            <span class="input-group-text">https://</span>
            <input type="url" class="form-control">
        </div>
    </section>
</body>

</html>
