<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <title>Document</title>
</head>
<style>
    .mt-btn {
        background-color: #000;
        border: 1px solid #000;
        transition: all 0.5s ease;
    }

    .mt-btn:hover {
        background-color: #fff;
        color: #000;
        border: 1px solid #000;
    }
</style>

<body>
    <section>
        <div>Buttons</div>
        <div>
            <button class="btn btn-primary">Click Me</button>
            <button class="btn btn-primary mt-btn">Click Me</button>
            <button class="btn btn-success">Success</button>
            <button class="btn btn-danger">Danger</button>
        </div>
    </section>
    <section>
        <p>Bootstrap - Container</p>
        <div class="container">
            <h1>Welcome</h1>
            <p>Hello World </p>
        </div>
    </section>
    <section>
        <p>Container class</p>
        <div class="container bg-primary">
            <div class="row">
                <div class="col-md-6 bg-danger">Left</div>
                <div class="col-md-6 bg-secondary text-light">Right</div>
            </div>
        </div>
    </section>
    <section>
        <p>Container fluid class</p>
        <div class="container-fluid bg-success">
            <div class="row">
                <div class="col-md-12 text-light">conten here</div>
            </div>
        </div>
    </section>
    <section>
        <p>Bootstrap Gutters</p>
        <div class="container">
            <div class="row g-3">
                <div class="col">
                    <div class="bg-primary text-light">A</div>
                </div>

                <div class="col">
                    <div class="bg-success text-light">B</div>
                </div>
            </div>
        </div>
    </section>
    <section>
        <p>m- and p-</p>
        <div class="container-fluid bg-success">
            <div class="row">
                <div class="col-md-6 bg-danger mx-5 ms-3 p-3">Left</div>
                <div class="col-md-6 bg-secondary text-light m-5 p-2">Right</div>
            </div>
        </div>
    </section>
    <section>
        <div class="bg-dark col-md-3">
            <img src="/Logo.png" alt="image" width="100%" height="100%">
            <div class="col text-center">
                <p class=" text-light">Card Name - Image</p>
                <p class=" text-light">Card Details</p>
                <button class="btn btn-primary py-3 px-5">Click Me!</button>
            </div>
        </div>
    </section>
</body>

</html>
