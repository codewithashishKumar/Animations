<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <title>Badge</title>
</head>

<body>
    <section class="m-2 border border-2 border-dark rounded-3 p-3">
        <h4>Badge Syntax</h4>

        <span class="badge bg-primary">
            New
        </span>
    </section>

    <section class="m-2 border border-2 border-dark rounded-3 p-3">
        <h4>Badge Basic Task</h4>
        <span class="badge bg-success">
            Done
        </span>
    </section>
    <section class="m-2 border border-2 border-dark rounded-3 p-3">
        <h4>Notifications <span class="badge bg-danger">
                8
            </span></h4>
    </section>
    <section class="m-2 border border-2 border-dark rounded-3 p-3">
        <span class="badge bg-success rounded-pill">
            Active
        </span>
    </section>
    <section class="m-2 border border-2 border-dark rounded-3 p-3">
        <h4>Badges with Buttons</h4>
        <button class="btn btn-primary">Messages
            <span class="badge bg-light text-dark">5</span>
        </button>
    </section>
    <section class="m-2 border border-2 border-dark rounded-3 p-3">
        <h4>Final Badge Practice</h4>
        <span class="badge rounded-pill bg-success">Online</span>
        <p>Notifications <span class="badge bg-danger">
                8
            </span></p>
        <button class="btn btn-primary">Messages
            <span class="badge bg-light text-dark">5</span>
        </button>
    </section>

</body>

</html>
