<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <title>Bootstrap Cards</title>
</head>
<style></style>

<body>
    <section>
        <h2>Cards Started</h2>
        <div class="card border-4 rounded-4">
            <div class="card-body">
                Hello Bootstrap
            </div>
        </div>
    </section>
    <section>
        <div class="card">
            <div class="card-body">

                <h5 class="card-title bg-warning">
                    iPhone 16
                </h5>

                <p>
                    ₹79,999
                </p>

                <button class="btn btn-primary">
                    Buy Now
                </button>

            </div>
        </div>
    </section>
    <section>
        <div class="card w-25">

            <img src="/Logo.png" class="card-img-top" alt="Logo">

            <div class="card-body">

                <h5 class="card-title">
                    iPhone 16
                </h5>

                <p class="card-text">
                    ₹79,999
                </p>

            </div>

        </div>
    </section>
    <section class="container w-50">
        <h3>This was task to create till yet</h3>
        <div class="card">
            <img src="/Logo.png" alt="Logo" class="card-img-top">
            <div class="card-body">
                <h5 class="card-title">Image Title here</h5>
                <p class="card-text">Some content about the image here</p>
                <button class="btn btn-info">Buy Now</button>
            </div>
        </div>
    </section>
</body>

</html>
