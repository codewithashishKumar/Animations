<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INIFINITE SCROLL </title>
</head>
<style>
    .carousel {
        margin: 100px auto;
        width: 80%;
        border: 2px solid #000;
        display: flex;
        overflow-x: auto;
    }

    .carousel::-webkit-scrollbar {
        display: none;
    }

    .group {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1em;
        animation: spin 5s linear infinite;
        padding-right: 1em;
    }

    .card {
        flex: 0 0 5em;
        height: 5em;
        padding: 1em;
        background-color: lightblue;
        font-size: 3rem;
        border-radius: 0.2em;
        text-align: center;
        align-items: center;
    }

    @keyframes spin {
        to {
            translate: -100%;
        }
    }
</style>

<body>

    <div class="carousel">
        <div class="group">
            <div class="card">Card 1</div>
            <div class="card">Card 2</div>
            <div class="card">Card 3</div>
            <div class="card">Card 4</div>
            <div class="card">Card 5</div>
        </div>
        <div aria-hidden class="group">
            <div class="card">Card 1</div>
            <div class="card">Card 2</div>
            <div class="card">Card 3</div>
            <div class="card">Card 4</div>
            <div class="card">Card 5</div>
        </div>
    </div>
</body>

</html>
